<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invite Link Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap">
<style>
:root{--ivory:#FBF6EE;--paper:#FFFDF8;--ink:#2A2118;--soft:#5A4A3C;--rose:#B5647A;--forest:#26301F;--line:#E6D9C6}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Jost','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:40px max(18px,env(safe-area-inset-left,0px)) 60px max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:40px;line-height:1.1;margin:0}
p{margin:0;color:var(--soft)}
label{font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}
.field{display:flex;flex-direction:column;gap:8px}
input,textarea{font:inherit;font-size:17px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:190px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:1px}
.link{font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all;background:var(--paper);border:1px dashed var(--rose);border-radius:12px;padding:12px 14px;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}
button,.btn{font:inherit;font-weight:500;font-size:15px;min-height:46px;padding:0 20px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.primary{background:#1F8F4E;color:#fff}
.secondary{background:var(--forest);color:#fff}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.status{min-height:1.4em;font-size:14px;color:#1F6E3E}
</style>
</head>
<body>
<main>
  <h1>Personal invite links</h1>
  <p>Type the guest's name. You get a link that opens the invite with "Dear …" on the envelope, and a WhatsApp message ready to send.</p>

  <div class="field">
    <label for="name">Guest name</label>
    <input id="name" placeholder="e.g. Sharma Family, Rahul Bhaiya" autocomplete="off">
  </div>

  <div class="field">
    <label>Their link</label>
    <div class="link" id="link"></div>
  </div>

  <div class="field">
    <label for="msg">Message</label>
    <textarea id="msg"></textarea>
  </div>

  <div class="row">
    <a class="btn primary" id="wa" href="#" target="_blank" rel="noopener">Send on WhatsApp</a>
    <button class="secondary" id="copyMsg" type="button">Copy message</button>
    <button class="ghost" id="copyLink" type="button">Copy link only</button>
    <a class="btn ghost" id="preview" href="#" target="_blank" rel="noopener">Preview</a>
  </div>
  <p class="status" id="status" role="status"></p>
</main>
<script>
const BASE = new URL('./', location.href).href;
const $ = id => document.getElementById(id);
let edited = false;
function slug(n){ return n.trim().replace(/[^\p{L}\p{N}&' ]/gu,'').replace(/\s+/g,'-'); }
function build(){
  const n = $('name').value.trim();
  const link = n ? BASE + '#' + encodeURIComponent(slug(n)).replace(/%2D/g,'-') : BASE;
  $('link').textContent = link;
  $('preview').href = link;
  if (!edited) {
    $('msg').value = (n ? `Dear ${n},\n\n` : '') +
`Dhananjay and Priya are getting married, and we would love for you to be there! 💍

Wedding: Wed, 25 Nov 2026, 7 PM · Atithi Palace, Ratlam
Reception: Sat, 28 Nov 2026, 7 PM onwards · Rocks Lawn, Katol, Nagpur

Open your invitation 💌
${link}`;
  } else {
    $('msg').value = $('msg').value.replace(/https?:\/\/\S+/, link);
  }
  $('wa').href = 'https://wa.me/?text=' + encodeURIComponent($('msg').value);
}
$('name').addEventListener('input', build);
$('msg').addEventListener('input', () => { edited = true; $('wa').href = 'https://wa.me/?text=' + encodeURIComponent($('msg').value); });
async function copy(text, done){
  try { await navigator.clipboard.writeText(text); $('status').textContent = done; }
  catch(e){ $('status').textContent = 'Copy failed. Select the text and copy it yourself.'; }
}
$('copyMsg').addEventListener('click', () => copy($('msg').value, 'Message copied.'));
$('copyLink').addEventListener('click', () => copy($('link').textContent, 'Link copied.'));
build();
</script>
</body>
</html>
